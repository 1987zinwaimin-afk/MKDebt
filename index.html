<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MKDebt</title>
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#182238;--muted:#71809a;--blue:#2463ff;--blue2:#0f43c8;--line:#e1e7f0;--red:#e5484d;--green:#138a55;--shadow:0 14px 35px rgba(30,55,100,.10)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#eaf0ff 0,#f3f6fc 35%,#eef2f8 100%);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:21px}.logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#0e42c8,#5d8aff);box-shadow:inset 0 2px 2px #ffffff77,0 9px 20px #2463ff44;text-shadow:0 2px 2px #001d66}.sub{font-size:11px;color:var(--muted);font-weight:700}.wrap{max-width:1200px;margin:auto;padding:18px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.nav button{border:0;padding:10px 15px;border-radius:13px;background:#e8eef9;color:#36538f;font-weight:850;white-space:nowrap;box-shadow:inset 0 1px #fff}.nav button.active{background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 8px 18px #2463ff33}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-35px;top:-40px;background:#2463ff0c}.stat b{display:block;font-size:25px;margin-top:8px}.muted{color:var(--muted);font-size:13px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.head h2,.head h3{margin:0}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:850;box-shadow:inset 0 1px #ffffff55}.primary{background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff}.ghost{background:#edf2f9;color:#263653}.danger{background:#fff0f1;color:#b62e36}.green{background:#e9f8f0;color:#087344}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:0}.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2463ff18;outline:0}.section{margin-top:15px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:12px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850;background:#edf2f7}.pill.green{color:#087344;background:#e9f8f0}.pill.red{color:#b62e36;background:#fff0f1}.pill.yellow{color:#8c6500;background:#fff6db}.loanchips{display:flex;gap:8px;overflow:auto;padding:4px 0 9px}.loanchip{min-width:150px;text-align:left;border:1px solid #dbe3ef;background:linear-gradient(145deg,#fff,#f6f8fc);border-radius:15px;padding:11px;box-shadow:0 6px 15px #1e37600d}.loanchip b{display:block}.notice{background:#edf4ff;border:1px solid #d7e4ff;color:#294d98;padding:11px;border-radius:12px;font-size:13px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:13px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d8e0eb;border-radius:11px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.empty{text-align:center;padding:34px;color:var(--muted)}.modal{position:fixed;inset:0;background:#07132d88;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.modal.show{display:flex}.modalbox{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:20px;box-shadow:0 25px 70px #07132d55}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modalhead h2{margin:0}.close{border:0;background:#edf1f7;width:38px;height:38px;border-radius:11px;font-size:22px}.hidden{display:none!important}.money{font-weight:900}.mini{font-size:11px;color:var(--muted)}@media(max-width:850px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2,.form{grid-template-columns:1fr}}@media(max-width:480px){.wrap{padding:12px}.top{padding:10px 12px}.brand{font-size:18px}.logo{width:39px;height:39px}.grid4{gap:9px}.card{padding:13px}.stat b{font-size:19px}.btn{padding:9px 11px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">MK</div><div>MKDebt<div class="sub">Debt Ledger • 10% Default</div></div></div>
  <button class="btn primary" onclick="openBorrower()">＋ New Borrower</button>
</header>
<main class="wrap">
<nav class="nav">
<button class="active" data-page="dashboard">Dashboard</button>
<button data-page="borrowers">Borrowers</button>
<button data-page="loans">Loans</button>
<button data-page="payments">Payments</button>
<button data-page="settings">Settings</button>
</nav>
<section id="dashboard" class="page"></section>
<section id="borrowers" class="page hidden"></section>
<section id="loans" class="page hidden"></section>
<section id="payments" class="page hidden"></section>
<section id="settings" class="page hidden"></section>
</main>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
const KEY="mkdebt_v2";
let db=JSON.parse(localStorage.getItem(KEY)||'{"borrowers":[],"loans":[],"payments":[],"settings":{"rate":10,"currency":"THB","monthlyDue":0}}');
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID();
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function money(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})+" "+db.settings.currency;}
function monthsBetween(start,asOf=new Date()){if(!start)return 0;let s=new Date(start+"T00:00:00");let d=new Date(asOf);let m=(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth();if(d.getDate()<s.getDate())m--;return Math.max(0,m);}
function loanPayments(lid){return db.payments.filter(p=>p.loanId===lid);}
function calc(l){
 let principal=Number(l.principal)||0, rate=Number(l.rate??db.settings.rate)||0;
 let months=l.paused?Number(l.lockedMonths||0):(l.manualMonths!==null&&l.manualMonths!==undefined?Number(l.manualMonths):monthsBetween(l.startDate));
 let monthlyInterest=principal*rate/100;
 let interest=monthlyInterest*months;
 let interestPaid=0, principalPaid=0, totalPaid=0;
 loanPayments(l.id).forEach(p=>{
   totalPaid+=Number(p.amount||0);
   interestPaid+=Number(p.interestAmount||0);
   principalPaid+=Number(p.principalAmount||0);
 });
 let unpaidInterest=Math.max(0,interest-interestPaid);
 let remainingPrincipal=Math.max(0,principal-principalPaid);
 return {months,monthlyInterest,interest,interestPaid,principalPaid,remainingPrincipal,unpaidInterest,total:principal+interest,paid:totalPaid,remaining:remainingPrincipal+unpaidInterest};
}
function switchPage(name){
 document.querySelectorAll(".page").forEach(x=>x.classList.toggle("hidden",x.id!==name));
 document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===name));
 render();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
function render(){let p=document.querySelector(".nav button.active").dataset.page;if(p==="dashboard")renderDashboard();if(p==="borrowers")renderBorrowers();if(p==="loans")renderLoans();if(p==="payments")renderPayments();if(p==="settings")renderSettings();}

function renderDashboard(){
 let principal=db.loans.reduce((s,l)=>s+Number(l.principal||0),0);
 let interest=db.loans.reduce((s,l)=>s+calc(l).interest,0);
 let paid=db.payments.reduce((s,p)=>s+Number(p.amount||0),0);
 let remaining=db.loans.reduce((s,l)=>s+calc(l).remaining,0);
 $("dashboard").innerHTML=`
 <div class="grid4">
  <div class="card stat"><span class="muted">Borrowers</span><b>${db.borrowers.length}</b></div>
  <div class="card stat"><span class="muted">Active Loans</span><b>${db.loans.length}</b></div>
  <div class="card stat"><span class="muted">Principal</span><b>${money(principal)}</b></div>
  <div class="card stat"><span class="muted">Remaining</span><b>${money(remaining)}</b></div>
 </div>
 <div class="grid2 section">
  <div class="card"><div class="head"><h2>Interest Summary</h2><span class="pill green">${db.settings.rate}% / month</span></div>
   <div class="grid2"><div><div class="muted">Auto Interest</div><b class="money">${money(interest)}</b></div><div><div class="muted">Total Paid</div><b class="money">${money(paid)}</b></div></div>
   <div class="notice section">Interest is calculated monthly from each loan start date. A paused loan adds no new monthly interest.</div>
  </div>
  <div class="card"><div class="head"><h2>Monthly Due</h2></div>
   <div class="money" style="font-size:28px">${money(db.settings.monthlyDue)}</div>
   <div class="muted">Owner-defined monthly payment target</div>
  </div>
 </div>
 <div class="card section"><div class="head"><h2>Borrowers & Loan Types</h2><button class="btn primary" onclick="openBorrower()">＋ Add Borrower</button></div>
 ${db.borrowers.length?db.borrowers.slice().reverse().map(b=>borrowerCard(b)).join(""):'<div class="empty">No borrowers yet. Add a borrower to start.</div>'}
 </div>`;
}
function borrowerCard(b){
 let ls=db.loans.filter(l=>l.borrowerId===b.id);
 return `<div class="card" style="box-shadow:none;margin:10px 0;background:#f9fbff">
 <div class="head"><div><b style="font-size:17px">${esc(b.name)}</b><div class="muted">${esc(b.phone||"")}</div></div><div class="row"><button class="btn ghost" onclick="openBorrower('${b.id}')">Edit</button><button class="btn primary" onclick="openLoan('${b.id}')">＋ Loan</button></div></div>
 <div class="loanchips">${ls.length?ls.map(l=>{let c=calc(l);return `<button class="loanchip" onclick="openLoanDetail('${l.id}')"><b>${esc(l.type||"Loan")}</b><span class="mini">${money(l.principal)}</span><span class="mini">${c.months} mo · ${l.paused?"Interest Paused":"Interest Active"}</span></button>`}).join(""):'<div class="muted">No loans yet.</div>'}</div></div>`;
}

function renderBorrowers(){
 $("borrowers").innerHTML=`<div class="head"><h2>Borrowers</h2><button class="btn primary" onclick="openBorrower()">＋ New Borrower</button></div><input id="bsearch" class="search" placeholder="Search borrower name / phone" oninput="filterBorrowers(this.value)"><div id="borrowerList" class="section"></div>`;
 filterBorrowers("");
}
function filterBorrowers(q){
 let a=db.borrowers.filter(b=>(b.name+" "+b.phone).toLowerCase().includes(q.toLowerCase()));
 $("borrowerList").innerHTML=a.length?a.map(b=>borrowerCard(b)).join(""):'<div class="card empty">No borrowers found.</div>';
}
function openBorrower(id){
 let b=db.borrowers.find(x=>x.id===id)||{name:"",phone:"",address:"",note:""};
 $("modalTitle").textContent=id?"Edit Borrower":"New Borrower";
 $("modalBody").innerHTML=`<form onsubmit="event.preventDefault();saveBorrower('${id||""}')">
 <div class="form">
 <div class="field"><label>Borrower Name *</label><input id="bn" required value="${esc(b.name)}"></div>
 <div class="field"><label>Phone</label><input id="bp" value="${esc(b.phone)}"></div>
 <div class="field"><label>Address</label><input id="ba" value="${esc(b.address)}"></div>
 <div class="field"><label>Note</label><textarea id="bo">${esc(b.note)}</textarea></div>
 </div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Save Borrower</button></div></form>`;
 showModal();
}
function saveBorrower(id){
 let d={name:$("bn").value.trim(),phone:$("bp").value.trim(),address:$("ba").value.trim(),note:$("bo").value.trim()};
 if(!d.name)return alert("Borrower name is required.");
 if(id)Object.assign(db.borrowers.find(x=>x.id===id),d);else db.borrowers.push({id:uid(),...d,createdAt:new Date().toISOString()});
 closeModal();save();switchPage("borrowers");
}
function deleteBorrower(id){
 if(!confirm("Delete this borrower and all related loans/payments?"))return;
 let ids=db.loans.filter(l=>l.borrowerId===id).map(l=>l.id);
 db.borrowers=db.borrowers.filter(b=>b.id!==id);db.loans=db.loans.filter(l=>l.borrowerId!==id);db.payments=db.payments.filter(p=>!ids.includes(p.loanId));save();
}

function renderLoans(){
 let totalAcc=db.loans.reduce((a,l)=>a+calc(l).interest,0);
 let unpaid=db.loans.reduce((a,l)=>a+calc(l).unpaidInterest,0);
 let principal=db.loans.reduce((a,l)=>a+calc(l).remainingPrincipal,0);
 $("loans").innerHTML=`<div class="head"><div><h2>Loan Register</h2><div class="muted">Each loan is calculated separately by month.</div></div><button class="btn primary" onclick="chooseBorrower()">＋ New Loan</button></div>
 <div class="grid4">
  <div class="card stat"><span class="muted">Loans</span><b>${db.loans.length}</b></div>
  <div class="card stat"><span class="muted">Accrued Interest</span><b>${money(totalAcc)}</b></div>
  <div class="card stat"><span class="muted">Unpaid Interest</span><b>${money(unpaid)}</b></div>
  <div class="card stat"><span class="muted">Principal Remaining</span><b>${money(principal)}</b></div>
 </div>
 <div class="card section tablewrap"><table class="table"><tr><th>Borrower</th><th>Loan Type</th><th>Principal</th><th>Start</th><th>Months</th><th>Rate</th><th>5-Month Example</th><th>Unpaid Interest</th><th>Remaining</th><th>Status</th></tr>
 ${db.loans.length?db.loans.slice().reverse().map(l=>{let b=db.borrowers.find(x=>x.id===l.borrowerId)||{},c=calc(l);let ex=l.principal*(Number(l.rate||0)/100)*5;return `<tr onclick="openLoanDetail('${l.id}')"><td><b>${esc(b.name||"Unknown")}</b></td><td>${esc(l.type||"Loan")}</td><td>${money(l.principal)}</td><td>${esc(l.startDate)}</td><td>${c.months}</td><td>${l.rate}%</td><td>${money(ex)}</td><td class="money">${money(c.unpaidInterest)}<div class="mini">${c.months} month(s)</div></td><td class="money">${money(c.remaining)}</td><td><span class="pill ${l.paused?"yellow":"green"}">${l.paused?"Interest Paused":"Active"}</span></td></tr>`}).join(""):'<tr><td colspan="10" class="empty">No loans yet.</td></tr>'}</table></div>`;
}
function chooseBorrower(){
 if(!db.borrowers.length){openBorrower();return}
 $("modalTitle").textContent="Choose Borrower";
 $("modalBody").innerHTML=`<div class="grid2">${db.borrowers.map(b=>`<button class="card" style="text-align:left" onclick="openLoan('${b.id}')"><b>${esc(b.name)}</b><div class="muted">${esc(b.phone||"")}</div></button>`).join("")}</div>`;
 showModal();
}
function openLoan(bid){
 let b=db.borrowers.find(x=>x.id===bid);
 $("modalTitle").textContent="New Loan — "+esc(b.name);
 $("modalBody").innerHTML=`<form onsubmit="event.preventDefault();saveLoan('${bid}')">
 <div class="form">
 <div class="field"><label>Loan Type / Name *</label><input id="lt" required></div>
 <div class="field"><label>Principal Amount *</label><input id="lp" required type="number" min="0" step="0.01"></div>
 <div class="field"><label>Monthly Interest %</label><input id="lr" type="number" min="0" step="0.01" value="${db.settings.rate}"></div>
 <div class="field"><label>Loan Start Date *</label><input id="ld" required type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Manual Interest Months (optional)</label><input id="lm" type="number" min="0" step="1"></div>
 <div class="field"><label>Monthly Payment Target</label><input id="lpay" type="number" min="0" step="0.01" value="${db.settings.monthlyDue||0}"></div>
 </div>
 <div class="notice section">If Manual Interest Months is empty, MKDebt automatically counts completed months from the loan start date. Example: 5 unpaid months → 5 months of interest.</div>
 <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Save Loan</button></div></form>`;
 showModal();
}
function saveLoan(bid){
 let manual=$("lm").value.trim();
 let l={id:uid(),borrowerId:bid,type:$("lt").value.trim(),principal:+$("lp").value,rate:+$("lr").value,startDate:$("ld").value,manualMonths:manual===""?null:+manual,monthlyPayment:+$("lpay").value,paused:false};
 if(!l.type||!l.principal)return alert("Loan type and amount are required.");
 db.loans.push(l);closeModal();save();switchPage("loans");
}
function openLoanDetail(id){
 let l=db.loans.find(x=>x.id===id),b=db.borrowers.find(x=>x.id===l.borrowerId),c=calc(l);
 $("modalTitle").textContent=esc(b.name)+" — "+esc(l.type);
 $("modalBody").innerHTML=`<div class="grid2">
 <div class="card"><div class="muted">Principal</div><b class="money">${money(l.principal)}</b><div class="mini">Paid: ${money(c.principalPaid)} · Remaining: ${money(c.remainingPrincipal)}</div></div>
 <div class="card"><div class="muted">Monthly Interest</div><b class="money">${money(c.monthlyInterest)}</b><div class="mini">${l.rate}% per month</div></div>
 <div class="card"><div class="muted">Accrued Interest</div><b class="money">${money(c.interest)}</b><div class="mini">${c.months} unpaid month(s) basis</div></div>
 <div class="card"><div class="muted">Unpaid Interest</div><b class="money">${money(c.unpaidInterest)}</b><div class="mini">Interest paid: ${money(c.interestPaid)}</div></div>
 <div class="card"><div class="muted">Principal + Accrued Interest</div><b class="money">${money(c.total)}</b></div>
 <div class="card"><div class="muted">Current Amount Due</div><b class="money">${money(c.remaining)}</b></div>
 </div>
 <div class="notice section"><b>5-month check:</b> ${money(l.principal)} × ${l.rate}% × 5 = <b>${money(l.principal*(Number(l.rate||0)/100)*5)}</b> interest. If 5 months are unpaid, this is the 5-month interest amount.</div>
 <div class="actions">
 <button class="btn ghost" onclick="openEditLoan('${l.id}')">Edit</button>
 <button class="btn ${l.paused?"green":"danger"}" onclick="togglePause('${l.id}')">${l.paused?"Resume Interest":"Pause Interest"}</button>
 <button class="btn primary" onclick="openPayment('${l.id}')">＋ Payment</button>
 </div>`;
 showModal();
}
function openEditLoan(id){
 let l=db.loans.find(x=>x.id===id);
 $("modalTitle").textContent="Edit Loan";
 $("modalBody").innerHTML=`<form onsubmit="event.preventDefault();saveEditLoan('${id}')"><div class="form">
 <div class="field"><label>Loan Type / Name</label><input id="elt" value="${esc(l.type)}"></div>
 <div class="field"><label>Principal</label><input id="elp" type="number" step="0.01" value="${l.principal}"></div>
 <div class="field"><label>Monthly Interest %</label><input id="elr" type="number" step="0.01" value="${l.rate}"></div>
 <div class="field"><label>Start Date</label><input id="eld" type="date" value="${l.startDate}"></div>
 <div class="field"><label>Manual Interest Months</label><input id="elm" type="number" min="0" value="${l.manualMonths??""}"></div>
 <div class="field"><label>Monthly Payment Target</label><input id="elpmt" type="number" min="0" step="0.01" value="${l.monthlyPayment||0}"></div>
 </div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Save Changes</button></div></form>`;
}
function saveEditLoan(id){
 let l=db.loans.find(x=>x.id===id),manual=$("elm").value.trim();
 Object.assign(l,{type:$("elt").value.trim(),principal:+$("elp").value,rate:+$("elr").value,startDate:$("eld").value,manualMonths:manual===""?null:+manual,monthlyPayment:+$("elpmt").value});
 closeModal();save();
}
function togglePause(id){let l=db.loans.find(x=>x.id===id);l.paused=!l.paused;closeModal();save();}
function openPayment(id){
 let l=db.loans.find(x=>x.id===id),b=db.borrowers.find(x=>x.id===l.borrowerId),c=calc(l);
 $("modalTitle").textContent="Payment — "+esc(b.name);
 $("modalBody").innerHTML=`<div class="notice">Current remaining: <b>${money(c.remaining)}</b></div>
 <form onsubmit="event.preventDefault();savePayment('${id}')"><div class="form section">
 <div class="field"><label>Payment Amount *</label><input id="pa" required type="number" min="0" max="${c.remaining}" step="0.01"></div>
 <div class="field"><label>Date</label><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Payment Allocation</label><select id="pt"><option value="auto">Auto — Interest first, then Principal</option><option value="interest">Interest only</option><option value="principal">Principal only</option></select></div>
 <div class="field"><label>Note</label><input id="pn"></div></div>
 <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Save Payment</button></div></form>`;
 showModal();
}
function savePayment(lid){
 let a=+$("pa").value;if(!a)return;
 let l=db.loans.find(x=>x.id===lid),c=calc(l),mode=$("pt").value;
 let interestAmount=0, principalAmount=0;
 if(mode==="interest"){interestAmount=Math.min(a,c.unpaidInterest);principalAmount=Math.max(0,a-interestAmount);}
 else if(mode==="principal"){principalAmount=Math.min(a,c.remainingPrincipal);interestAmount=Math.max(0,a-principalAmount);}
 else {interestAmount=Math.min(a,c.unpaidInterest);principalAmount=Math.max(0,Math.min(c.remainingPrincipal,a-interestAmount));}
 db.payments.push({id:uid(),loanId:lid,amount:a,interestAmount,principalAmount,date:$("pd").value,type:mode,note:$("pn").value.trim()});
 closeModal();save();switchPage("payments");
}
function renderPayments(){
 $("payments").innerHTML=`<div class="head"><h2>Payments</h2></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Borrower</th><th>Loan</th><th>Type</th><th>Amount</th><th>Interest</th><th>Principal</th><th>Note</th></tr>
 ${db.payments.length?db.payments.slice().reverse().map(p=>{let l=db.loans.find(x=>x.id===p.loanId),b=l&&db.borrowers.find(x=>x.id===l.borrowerId);return `<tr><td>${esc(p.date)}</td><td>${esc(b?.name||"")}</td><td>${esc(l?.type||"")}</td><td>${esc(p.type||"")}</td><td class="money">${money(p.amount)}</td><td>${money(p.interestAmount||0)}</td><td>${money(p.principalAmount||0)}</td><td>${esc(p.note||"")}</td></tr>`}).join(""):'<tr><td colspan="8" class="empty">No payments yet.</td></tr>'}</table></div>`;
}
function renderSettings(){
 $("settings").innerHTML=`<div class="grid2">
 <div class="card"><div class="head"><h2>Owner Settings</h2></div><div class="form">
 <div class="field"><label>Default Monthly Interest %</label><input id="sr" type="number" min="0" step="0.01" value="${db.settings.rate}"></div>
 <div class="field"><label>Monthly Payment Target</label><input id="sd" type="number" min="0" step="0.01" value="${db.settings.monthlyDue}"></div>
 <div class="field"><label>Currency</label><select id="sc"><option ${db.settings.currency==="THB"?"selected":""}>THB</option><option ${db.settings.currency==="MMK"?"selected":""}>MMK</option><option ${db.settings.currency==="USD"?"selected":""}>USD</option></select></div>
 </div><div class="actions"><button class="btn primary" onclick="saveSettings()">Save Settings</button></div></div>
 <div class="card"><h2>Interest Rule</h2><p class="muted">Default is 10% per month. Each loan can have its own rate. Interest can be paused on an individual loan.</p><div class="notice">For example, 100,000 at 10% for 5 months = 50,000 interest; principal + interest = 150,000.</div></div></div>
 <div class="card section"><h3>Local Data</h3><p class="muted">This starter version stores data in the current browser. Do not clear browser storage if you want to keep this device's data.</p><button class="btn danger" onclick="wipe()">Delete All MKDebt Data</button></div>`;
}
function saveSettings(){db.settings.rate=+$("sr").value||0;db.settings.monthlyDue=+$("sd").value||0;db.settings.currency=$("sc").value;save();alert("Settings saved.");}
function wipe(){if(confirm("Delete ALL MKDebt data from this browser?")){localStorage.removeItem(KEY);location.reload();}}
function showModal(){$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
render();
</script>
</body>
</html>
